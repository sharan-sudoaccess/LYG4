name: lint

on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck scripts
        run: shellcheck install.sh scripts/* config/polybar/launch.sh
      - name: validate i3 config
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq i3-wm
          i3 -C -c config/i3/config
