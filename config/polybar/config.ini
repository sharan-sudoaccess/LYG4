; ~/.config/polybar/config.ini
; colors.ini is generated by dt-theme

include-file = ~/.config/polybar/colors.ini

[bar/main]
monitor = ${env:MONITOR:}
; floating, rounded bar with a small margin around it
width = 100%:-16
offset-x = 8
offset-y = 6
radius = 8
height = 28
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 2
padding-left = 0
padding-right = 2
module-margin = 1
separator = |
separator-foreground = ${colors.muted}

font-0 = JetBrains Mono:size=10;2

modules-left = i3
modules-center = title
modules-right = tray volume sysinfo date

wm-restack = i3
enable-ipc = true
cursor-click = pointer

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = false
enable-scroll = false

label-focused = %name%
label-focused-background = ${colors.accent}
label-focused-foreground = ${colors.bg}
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 2

label-visible = %name%
label-visible-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.urgent}
label-urgent-foreground = ${colors.bg}
label-urgent-padding = 2

label-mode = %mode%
label-mode-background = ${colors.accent}
label-mode-foreground = ${colors.bg}
label-mode-padding = 1

[module/title]
type = internal/xwindow
label = %title:0:60:...%
label-foreground = ${colors.muted}

; system tray: Wi-Fi (nm-applet) and Bluetooth (blueman) icons live here
[module/tray]
type = internal/tray
tray-spacing = 8px
tray-size = 60%

[module/volume]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.accent}
label-volume = %percentage%%
label-muted = muted
label-muted-foreground = ${colors.muted}
click-right = pavucontrol &

[module/sysinfo]
type = custom/script
exec = ~/.local/bin/dt-sysinfo --bar
interval = 3
click-left = ~/.local/bin/dt-sysinfo --notify

[module/date]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
label = %date%  %time%
label-foreground = ${colors.fg}
