; ~/.config/polybar/config.ini — waybar-style bar: rounded "pills" with icons
; colors.ini is generated by dt-theme. Icons need a Nerd Font (install.sh adds one).

include-file = ~/.config/polybar/colors.ini

[bar/main]
monitor = ${env:MONITOR:}
width = 100%:-16
offset-x = 8
offset-y = 6
height = 28
background = #00000000
foreground = ${colors.fg}
padding = 0
module-margin = 3px

font-0 = JetBrains Mono:size=10;3
font-1 = JetBrainsMono Nerd Font:size=13;4
font-2 = Symbols Nerd Font:size=13;4
; font-3: only for the rounded pill ends, sized to the bar height
font-3 = JetBrainsMono Nerd Font:size=17;4

modules-left = launcher i3 title
modules-center = date
modules-right = tray network bluetooth volume brightness sysinfo power

wm-restack = i3
enable-ipc = true
cursor-click = pointer
cursor-scroll = ns-resize

; ---------------------------------------------------------------- left
[module/launcher]
type = custom/text
format = " 󰀻 "
format-foreground = ${colors.bg}
format-background = ${colors.accent}
format-prefix = 
format-prefix-font = 4
format-prefix-foreground = ${colors.accent}
format-prefix-background = #00000000
format-suffix = 
format-suffix-font = 4
format-suffix-foreground = ${colors.accent}
format-suffix-background = #00000000
click-left = rofi -config ~/.config/devdesk/rofi/config.rasi -show drun &

[module/i3]
type = internal/i3
pin-workspaces = true
enable-scroll = true
format = <label-state> <label-mode>
format-prefix = 
format-prefix-font = 4
format-prefix-foreground = ${colors.bg-alt}
format-prefix-background = #00000000
format-suffix = 
format-suffix-font = 4
format-suffix-foreground = ${colors.bg-alt}
format-suffix-background = #00000000
format-background = ${colors.bg-alt}

label-focused = %name%
label-focused-background = ${colors.accent}
label-focused-foreground = ${colors.bg}
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 1
label-visible = %name%
label-visible-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.urgent}
label-urgent-foreground = ${colors.bg}
label-urgent-padding = 1
label-mode = %mode%
label-mode-foreground = ${colors.urgent}
label-mode-padding = 1

[module/title]
type = internal/xwindow
format-prefix = 
format-prefix-font = 4
format-prefix-foreground = ${colors.bg-alt}
format-prefix-background = #00000000
format-suffix = 
format-suffix-font = 4
format-suffix-foreground = ${colors.bg-alt}
format-suffix-background = #00000000
format-background = ${colors.bg-alt}
label = %title:0:45:...%
label-empty = desktop
label-foreground = ${colors.fg}
label-empty-foreground = ${colors.muted}
label-padding = 1
label-empty-padding = 1

; ---------------------------------------------------------------- center
[module/date]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
date-alt = %A, %d %B %Y
format-prefix = 
format-prefix-font = 4
format-prefix-foreground = ${colors.bg-alt}
format-prefix-background = #00000000
format-suffix = 
format-suffix-font = 4
format-suffix-foreground = ${colors.bg-alt}
format-suffix-background = #00000000
format-background = ${colors.bg-alt}
label = "󰃭 %date%   󰥔 %time%"
label-padding = 1

; ---------------------------------------------------------------- right
; tray for apps that have one (Discord, Steam, ...)
[module/tray]
type = internal/tray
tray-spacing = 8px
tray-size = 55%

; Wi-Fi name; click opens the Wi-Fi menu (nmtui)
[module/network]
type = internal/network
interface-type = wireless
interval = 5
format-connected-prefix = 
format-connected-prefix-font = 4
format-connected-prefix-foreground = ${colors.bg-alt}
format-connected-prefix-background = #00000000
format-connected-suffix = 
format-connected-suffix-font = 4
format-connected-suffix-foreground = ${colors.bg-alt}
format-connected-suffix-background = #00000000
format-connected-background = ${colors.bg-alt}
format-disconnected-prefix = 
format-disconnected-prefix-font = 4
format-disconnected-prefix-foreground = ${colors.bg-alt}
format-disconnected-prefix-background = #00000000
format-disconnected-suffix = 
format-disconnected-suffix-font = 4
format-disconnected-suffix-foreground = ${colors.bg-alt}
format-disconnected-suffix-background = #00000000
format-disconnected-background = ${colors.bg-alt}
format-connected = " <ramp-signal> <label-connected>"
ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨
ramp-signal-foreground = ${colors.accent}
label-connected = "%{A1:kitty --config ~/.config/devdesk/kitty/kitty.conf --class floating-nmtui -e nmtui &:}%essid% %{A}"
label-disconnected = "%{A1:kitty --config ~/.config/devdesk/kitty/kitty.conf --class floating-nmtui -e nmtui &:}󰖪 offline %{A}"
label-disconnected-foreground = ${colors.muted}
label-disconnected-padding = 1

; Bluetooth on/off + connected device; click = on/off, right-click = manager
[module/bluetooth]
type = custom/script
exec = ~/.local/bin/dt-bar bluetooth
interval = 5
format-prefix = 
format-prefix-font = 4
format-prefix-foreground = ${colors.bg-alt}
format-prefix-background = #00000000
format-suffix = 
format-suffix-font = 4
format-suffix-foreground = ${colors.bg-alt}
format-suffix-background = #00000000
format-background = ${colors.bg-alt}
label = %output%
label-padding = 1
click-left = ~/.local/bin/dt-bar bluetooth-toggle
click-right = blueman-manager &

; scroll = volume, click = mute, right-click = sound settings
[module/volume]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = " <ramp-volume> <label-volume>"
format-volume-prefix = 
format-volume-prefix-font = 4
format-volume-prefix-foreground = ${colors.bg-alt}
format-volume-prefix-background = #00000000
format-volume-suffix = 
format-volume-suffix-font = 4
format-volume-suffix-foreground = ${colors.bg-alt}
format-volume-suffix-background = #00000000
format-volume-background = ${colors.bg-alt}
format-muted-prefix = 
format-muted-prefix-font = 4
format-muted-prefix-foreground = ${colors.bg-alt}
format-muted-prefix-background = #00000000
format-muted-suffix = 
format-muted-suffix-font = 4
format-muted-suffix-foreground = ${colors.bg-alt}
format-muted-suffix-background = #00000000
format-muted-background = ${colors.bg-alt}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.accent}
format-volume-padding = 0
label-volume = "%percentage%% "
label-muted = " 󰖁 muted "
label-muted-foreground = ${colors.muted}
click-right = pavucontrol &

; screen brightness (hidden on desktops); scroll to change
[module/brightness]
type = custom/script
exec = ~/.local/bin/dt-bar brightness
interval = 2
format-prefix = 
format-prefix-font = 4
format-prefix-foreground = ${colors.bg-alt}
format-prefix-background = #00000000
format-suffix = 
format-suffix-font = 4
format-suffix-foreground = ${colors.bg-alt}
format-suffix-background = #00000000
format-background = ${colors.bg-alt}
label = %output%
label-padding = 1
scroll-up = ~/.local/bin/dt-bar brightness-up
scroll-down = ~/.local/bin/dt-bar brightness-down

; CPU / RAM / battery — the dt-sysinfo script (click for a popup)
[module/sysinfo]
type = custom/script
exec = ~/.local/bin/dt-sysinfo --bar
interval = 3
format-prefix = 
format-prefix-font = 4
format-prefix-foreground = ${colors.bg-alt}
format-prefix-background = #00000000
format-suffix = 
format-suffix-font = 4
format-suffix-foreground = ${colors.bg-alt}
format-suffix-background = #00000000
format-background = ${colors.bg-alt}
label = %output%
label-padding = 1
click-left = ~/.local/bin/dt-sysinfo --notify

[module/power]
type = custom/text
format = " 󰐥 "
format-foreground = ${colors.bg}
format-background = ${colors.urgent}
format-prefix = 
format-prefix-font = 4
format-prefix-foreground = ${colors.urgent}
format-prefix-background = #00000000
format-suffix = 
format-suffix-font = 4
format-suffix-foreground = ${colors.urgent}
format-suffix-background = #00000000
click-left = ~/.local/bin/dt-power &
