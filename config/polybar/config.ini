; ~/.config/polybar/config.ini
; colors.ini is generated by dt-theme

include-file = ~/.config/polybar/colors.ini

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 26
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 2
padding-left = 1
padding-right = 2
module-margin = 1
separator = |
separator-foreground = ${colors.muted}

font-0 = JetBrains Mono:size=10;2

modules-left = i3
modules-center = title
modules-right = sysinfo date

wm-restack = i3
enable-ipc = true
cursor-click = pointer

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = false
enable-scroll = false

label-focused = %name%
label-focused-background = ${colors.bg-alt}
label-focused-underline = ${colors.accent}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 1

label-visible = %name%
label-visible-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.urgent}
label-urgent-foreground = ${colors.bg}
label-urgent-padding = 1

label-mode = %mode%
label-mode-background = ${colors.accent}
label-mode-foreground = ${colors.bg}
label-mode-padding = 1

[module/title]
type = internal/xwindow
label = %title:0:60:...%
label-foreground = ${colors.muted}

[module/sysinfo]
type = custom/script
exec = ~/.local/bin/dt-sysinfo
interval = 3
format-prefix = "SYS "
format-prefix-foreground = ${colors.accent}
click-left = ~/.local/bin/dt-sysinfo --notify

[module/date]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
label = %date%  %time%
format-prefix = "  "
label-foreground = ${colors.fg}
format-underline = ${colors.accent}
