# ~/.config/libinput-gestures.conf — touchpad gestures for the devdesk i3 session.
#
# Every gesture just presses one of the i3 keyboard shortcuts, so a gesture
# and its key always do exactly the same thing.
# After editing: libinput-gestures-setup restart

# --- 3 fingers ---------------------------------------------------------------
# swipe left / right: next / previous workspace  (Super+] / Super+[)
gesture swipe left  3 xdotool key super+bracketright
gesture swipe right 3 xdotool key super+bracketleft
# swipe up: window switcher  (Super+Tab)
gesture swipe up    3 xdotool key super+Tab
# swipe down: drop-down terminal  (Super+-)
gesture swipe down  3 xdotool key super+minus

# --- 4 fingers ---------------------------------------------------------------
# swipe left / right: carry the current window to the next / previous workspace
gesture swipe left  4 xdotool key super+shift+bracketright
gesture swipe right 4 xdotool key super+shift+bracketleft
# swipe up: fullscreen on/off  (Super+Shift+f)
gesture swipe up    4 xdotool key super+shift+f
# swipe down: float / tile the window  (Super+Shift+Space)
gesture swipe down  4 xdotool key super+shift+space

# --- pinch (4 fingers, so normal 2-finger zoom in apps still works) ----------
# pinch in: app launcher  (Super+d)
gesture pinch in    4 xdotool key super+d
# pinch out: shortcut cheat sheet  (Super+/)
gesture pinch out   4 xdotool key super+slash
