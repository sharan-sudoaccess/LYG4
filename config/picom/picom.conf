# ~/.config/picom/picom.conf — light compositor: shadows, fades, round corners
backend = "xrender";
vsync = true;

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.35;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-exclude = [ "class_g = 'Polybar'", "_GTK_FRAME_EXTENTS@:c" ];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;

corner-radius = 8;
rounded-corners-exclude = [ "class_g = 'Polybar'" ];
